<!doctype html>
<html lang="en" manifest="cache.appcache">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Loopayeh</title>
    <style>
:root{--bg:#101014;--card:#1b1d24;--txt:#f1f3f8;--mut:#9aa3b5;--acc:#4f8ef7;--ok:#7fd0a0;--bad:#e17b7b;--warn:#e3c878}
*{box-sizing:border-box;margin:0;padding:0}
html,body{min-height:100%;background:radial-gradient(1400px 700px at 50% -10%,#232b3a 0%,var(--bg) 65%);color:var(--txt);font:20px/1.5 system-ui,"Segoe UI",sans-serif}
#brand{display:flex;align-items:center;gap:14px;padding:16px 28px;background:rgba(27,29,36,.9);border-bottom:1px solid #2a2a2a}
#brand img{width:56px;height:56px;border-radius:50%;flex:none}
#brand b{font-size:24px;letter-spacing:.12em}
#brand small{display:block;color:var(--mut);font-size:14px;letter-spacing:0}
#stage{max-width:900px;margin:0 auto;padding:34px 30px 20px;text-align:center}
#runmsg{font-size:30px;font-weight:700;margin:18px 0 6px}
#sub{color:var(--mut);font-size:17px;min-height:28px}
#bar{height:14px;background:#24262e;border-radius:8px;margin:22px 0 8px;overflow:hidden}
#bar i{display:block;height:100%;width:12%;border-radius:8px;background:linear-gradient(90deg,var(--acc),#b693f1)}
#steps{display:flex;gap:10px;margin-top:26px;text-align:left}
.step{flex:1;background:var(--card);border:1px solid #2c2f3a;border-radius:14px;padding:14px 16px;font-size:16px;color:var(--mut)}
.step b{display:block;font-size:26px;margin-bottom:2px;color:var(--acc)}
#msg{display:none;font-size:30px;font-weight:700;margin:18px 0 6px;color:var(--bad)}
#donemsg{display:none;font-size:30px;font-weight:700;margin:18px 0 6px;color:var(--ok)}
#wrap{max-width:900px;margin:0 auto;padding:0 30px 30px}
#state,#out{display:none}
body.done #runmsg,body.done #sub,body.done #bar,body.done #steps{display:none}
body.done #donemsg{display:block}
body.fail #runmsg,body.fail #sub,body.fail #bar,body.fail #steps{display:none}
body.fail #msg{display:block}
body.log #stage{display:none}
body.log #wrap{padding:26px 30px 30px}
body.log #state{display:block;font-size:24px;font-weight:700;margin-bottom:10px}
body.log #out{display:block;white-space:pre-wrap;font:15px/1.5 Consolas,monospace;background:var(--card);border:1px solid #2c2f3a;border-radius:12px;padding:14px 16px;max-height:60vh;overflow-y:auto}
.ok{color:var(--ok)}.bad{color:var(--bad)}.warn{color:var(--warn)}.safe{color:var(--ok)}.danger{color:var(--bad)}code{color:#9fb3d0}
</style>
  </head>
  <body>
    <div id="brand"><img src="logo.png" alt=""><div><b>LOOPAYEH</b><small>PS4 Jailbreak Host &middot; 13.00 / 13.02 / 13.04 / 13.50 / 13.52</small></div></div>
    <div id="stage">
      <div id="runmsg">Running exploit&hellip;</div>
      <div id="sub">do not close this page</div>
      <div id="bar"><i></i></div>
      <div id="steps">
        <div class="step"><b>&#9673;</b>1. Exploit</div>
        <div class="step"><b>&#9675;</b>2. Kernel patches</div>
        <div class="step"><b>&#9675;</b>3. Payloads</div>
      </div>
      <div id="msg">&#10006; Exploit failed &mdash; restart the console &amp; try again</div>
      <div id="donemsg">&#10004; Jailbroken &mdash; enjoy!</div>
    </div>
    <div id="wrap">
      <div id="state"></div>
      <div id="out"></div>
    </div>
    <script type="module">
      import "./jb.js";
    </script>
  </body>
</html>
