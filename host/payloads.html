<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Loopayeh - Payloads</title>
<style>
:root{--bg:#101014;--card:#1b1d24;--txt:#f1f3f8;--mut:#9aa3b5;--acc:#4f8ef7;--ok:#7fd0a0;--bad:#e17b7b;--warn:#e3c878}
*{box-sizing:border-box;margin:0;padding:0}
body{background:radial-gradient(1400px 700px at 50% -10%,#232b3a 0%,var(--bg) 65%);color:var(--txt);font:20px/1.7 system-ui,"Segoe UI",sans-serif;min-height:100vh;display:flex;justify-content:center;padding:24px 16px}
.wrap{width:100%;max-width:640px}
.card{background:var(--card);border:1px solid #2c2f3a;border-radius:20px;padding:26px 28px;text-align:center;margin-bottom:16px}
.top{display:flex;align-items:center;gap:14px;text-align:left;margin-bottom:8px}
.top img{width:60px;height:60px;border-radius:50%;flex:none}
.top b{font-size:23px;letter-spacing:.12em}
.top small{display:block;color:var(--mut);font-size:13px;margin-top:2px}
#msgs{font-size:28px;font-weight:800;margin:14px 0 4px;min-height:48px}
#msgs.ok{color:var(--ok)}#msgs.bad{color:var(--bad)}#msgs.warn{color:var(--warn)}
h2{font-size:18px;color:var(--mut);margin:18px 0 8px;text-align:left;letter-spacing:.06em}
.grid{display:flex;flex-wrap:wrap;gap:10px;justify-content:center}
.grid button{flex:1 1 40%;min-width:200px;background:#24262e;color:var(--txt);border:1px solid #3a3d48;border-radius:14px;padding:14px 10px;font-size:19px;font-weight:700;cursor:pointer}
.grid button:hover{border-color:var(--acc);background:#2a2d38}
.grid button small{display:block;font-size:13px;color:var(--mut);font-weight:400;margin-top:2px}
.foot{color:var(--mut);font-size:13px;margin-top:14px;text-align:center}
.foot a{color:var(--acc)}
</style>
</head>
<body>
<div class="wrap">
  <div class="card">
    <div class="top">
      <img src="logo.png" alt="">
      <div><b>LOOPAYEH</b><small>Payloads &middot; run after jailbreak</small></div>
    </div>
    <div id="msgs">Pick a payload</div>
    <button id="verifyBtn" onclick="verifyBins()" style="background:#24262e;color:var(--mut);border:1px solid #3a3d48;border-radius:10px;padding:8px 18px;font-size:15px;cursor:pointer">Verify offline files</button>
    <div id="verify" style="font-size:15px;color:var(--mut);min-height:24px;margin-top:6px"></div>

    <h2>SYSTEM</h2>
    <div class="grid">
      <button onclick="sendBin('disableupdates.bin','Updates blocked')">Disable Updates<small>block system updates</small></button>
    </div>

    <h2>GTA V MODS</h2>
    <div class="grid">
      <button onclick="sendBin('gtava1.bin','GTAV A1 sent')">GTAV A1<small>ArabicGuy 1.00</small></button>
      <button onclick="sendBin('gtava2.bin','GTAV A2 sent')">GTAV A2<small>ArabicGuy 1.27</small></button>
      <button onclick="sendBin('gtava3.bin','GTAV A3 sent')">GTAV A3<small>ArabicGuy 1.32</small></button>
      <button onclick="sendBin('gtavl.bin','GTAV L sent')">GTAV L<small>Lamance 1.32</small></button>
      <button onclick="sendBin('gtavbq132.bin','GTAV BQ1 sent')">GTAV BQ1<small>BeefQueef 1.32</small></button>
      <button onclick="sendBin('gtavbq133.bin','GTAV BQ2 sent')">GTAV BQ2<small>BeefQueef 1.33</small></button>
      <button onclick="sendBin('Lamance9.bin','GTAV L 1.38 sent')">GTAV L 1.38<small>Lamance v9, game 1.38</small></button>
    </div>

    <h2>RDR2 MODS</h2>
    <div class="grid">
      <button onclick="sendBin('Oysters1.13.bin','RDR2 1.13 sent')">RDR2 1.13<small>Oysters menu, R1+Square</small></button>
      <button onclick="sendBin('Oysters1.19.bin','RDR2 1.19 sent')">RDR2 1.19<small>Oysters menu, R1+Square</small></button>
      <button onclick="sendBin('Oysters1.24.bin','RDR2 1.24 sent')">RDR2 1.24<small>Oysters menu, R1+Square</small></button>
    </div>
  </div>
  <div class="foot"><a href="index.html">Back to jailbreak</a> &middot; Loopayeh Payloads</div>
</div>

<script>
var msgs = document.getElementById("msgs");
var BINS = ['disableupdates.bin','gtava1.bin','gtava2.bin','gtava3.bin','gtavl.bin','gtavbq132.bin','gtavbq133.bin','Lamance9.bin','Oysters1.13.bin','Oysters1.19.bin','Oysters1.24.bin'];
function verifyBins() {
  var box = document.getElementById("verify");
  box.textContent = "Checking 11 files...";
  var missing = [];
  var i = 0;
  function next() {
    if (i >= BINS.length) {
      box.textContent = missing.length === 0
        ? "All 11 files cached, offline ready"
        : "Missing (" + missing.length + "): " + missing.join(", ") + " - re-run the cache page";
      return;
    }
    var f = BINS[i++];
    var r = new XMLHttpRequest();
    r.open("GET", "fw/payloads/" + f);
    r.responseType = "arraybuffer";
    r.onload = function () {
      if (!r.response || r.response.byteLength < 1000) missing.push(f);
      next();
    };
    r.onerror = function () { missing.push(f); next(); };
    r.send();
  }
  next();
}
function setMsg(t, c) { msgs.textContent = t; msgs.className = c || ""; }
function sendBin(file, doneText) {
  setMsg("Loading " + file + "...", "warn");
  var g = new XMLHttpRequest();
  g.open("GET", "fw/payloads/" + file);
  g.responseType = "arraybuffer";
  g.onerror = function () { setMsg("Could not load " + file + " - refresh the offline cache", "bad"); };
  g.onload = function () {
    if (!g.response || g.response.byteLength < 1000) { setMsg("Bad file: " + file, "bad"); return; }
    setMsg("Contacting BinLoader...", "warn");
    var st = new XMLHttpRequest();
    st.open("GET", "http://127.0.0.1:9090/status");
    try { st.timeout = 8000; } catch (e) {}
    st.ontimeout = st.onerror = function () {
      setMsg("Cannot reach BinLoader at 127.0.0.1:9090 - open this page on the PS4 browser AFTER GoldHEN is loaded, with BinLoader Server enabled", "bad");
    };
    st.onload = function () {
      var ok = false;
      try { ok = JSON.parse(st.responseText).status === "ready"; } catch (e) {}
      if (!ok) { setMsg("BinLoader is busy, try again", "bad"); return; }
      var p = new XMLHttpRequest();
      p.open("POST", "http://127.0.0.1:9090", true);
      p.onload = function () { setMsg(doneText, "ok"); };
      p.onerror = function () { setMsg("Send failed, try again", "bad"); };
      p.send(g.response);
    };
    st.send();
  };
  g.send();
}
</script>
</body>
</html>
